<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocem — Sistema de Obras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<!-- ===== PANTALLA DE LOGIN ===== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#e07b2a"/>
        <path d="M10 36V20l14-10 14 10v16H10z" stroke="#fff" stroke-width="2.5" fill="none"/>
        <rect x="19" y="24" width="10" height="12" rx="1" fill="#fff"/>
      </svg>
      <span>PROTOCEM</span>
    </div>
    <p class="login-sub">Sistema de Gestión de Obras</p>
    <div id="login-error" class="login-error hidden"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="l-correo" placeholder="usuario@protocem.mx" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="l-pass" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-full" id="btn-login">Iniciar sesión</button>
    </form>
  </div>
</div>

<!-- ===== APP PRINCIPAL ===== -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#e07b2a"/>
          <path d="M10 36V20l14-10 14 10v16H10z" stroke="#fff" stroke-width="2.5" fill="none"/>
          <rect x="19" y="24" width="10" height="12" rx="1" fill="#fff"/>
        </svg>
        <span>PROTOCEM</span>
      </div>
    </div>

    <div class="sidebar-user" id="sidebar-user">
      <div class="user-avatar" id="user-avatar">C</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Usuario</div>
        <div class="user-role" id="user-role">rol</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a href="#" class="nav-item" data-page="proyectos">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Proyectos
      </a>
      <a href="#" class="nav-item nav-admin hidden" data-page="importacion">
        <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        Importar desde Opus
      </a>
      <a href="#" class="nav-item" data-page="compras">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 6.1 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0023.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Compras
      </a>
      <a href="#" class="nav-item" data-page="salidas">
        <svg viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
        Salidas
      </a>
      <a href="#" class="nav-item" data-page="inventario">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        Inventario
      </a>
      <a href="#" class="nav-item" data-page="cotizaciones">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        Cotizaciones
      </a>
      <a href="#" class="nav-item" data-page="presupuesto">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zm-2 8H7v-2h4v2zm4-4H7v-2h8v2z"/></svg>
        Presupuesto
      </a>
      <a href="#" class="nav-item" data-page="estimaciones">
        <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
        Estimaciones
      </a>
      <a href="#" class="nav-item" data-page="catalogo">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        Catálogo OPUS
      </a>
      <a href="#" class="nav-item nav-admin hidden" data-page="usuarios">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        Usuarios
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" id="btn-logout">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <div id="page-content"></div>
  </main>
</div>

<!-- Modal genérico -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Título</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Undo bar -->
<div id="undo-bar" class="undo-bar hidden">
  <span id="undo-msg"></span>
  <button class="undo-btn" onclick="executeUndo()">&#8629; Deshacer (<span id="undo-secs">10</span>s)</button>
  <button class="undo-close" onclick="_hideUndoBar()" title="Cerrar">&times;</button>
</div>

<script src="/js/utils.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/proyectos.js"></script>
<script src="/js/pages/compras.js"></script>
<script src="/js/pages/salidas.js"></script>
<script src="/js/pages/inventario.js"></script>
<script src="/js/pages/cotizaciones.js"></script>
<script src="/js/pages/usuarios.js"></script>
<script src="/js/pages/presupuesto.js"></script>
<script src="/js/pages/estimaciones.js"></script>
<script src="/js/pages/catalogo.js"></script>
<script src="/js/pages/importacion.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
